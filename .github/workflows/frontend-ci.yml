name: Frontend CI

on:
  push:
    paths:
      - 'components/**'
      - 'mobile/**'
      - 'services/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'yarn.lock'
      - 'package-lock.json'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'components/**'
      - 'mobile/**'
      - 'services/**'

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci

      - name: Lint
        run: |
          npm run lint --if-present

      - name: Type check
        run: |
          npm run typecheck --if-present || npx tsc -p tsconfig.json --noEmit

      - name: Test
        env:
          CI: 'true'
        run: |
          npm test --if-present || npx vitest run --coverage
