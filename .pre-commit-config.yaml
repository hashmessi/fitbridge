repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: forbid-submodules
      - id: check-added-large-files

  - repo: https://github.com/psf/black
    rev: 24.3.0
    hooks:
      - id: black
        name: black (backend)
        language_version: python3
        additional_dependencies: []
        files: ^fitbridge/backend/.*\.py$

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        name: isort (backend)
        files: ^fitbridge/backend/.*\.py$
        args: ['--profile=black']

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.8
    hooks:
      - id: ruff
        name: ruff (backend)
        files: ^fitbridge/backend/.*\.py$
        args: ['--fix']

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        name: mypy (backend)
        files: ^fitbridge/backend/app/.*\.py$
        additional_dependencies: ['pydantic', 'pydantic-settings', 'fastapi', 'types-requests']

  - repo: local
    hooks:
      - id: prettier
        name: prettier (frontend)
        entry: npx
        language: node
        files: \.(ts|tsx|js|jsx|json|css|scss|md|yml|yaml)$
        args: ['prettier', '--write']
      - id: eslint
        name: eslint (frontend)
        entry: npx
        language: node
        files: ^(components|mobile|services|tests|frontend-ui|App\.tsx|index\.tsx|.*\.ts|.*\.tsx)$
        args: ['eslint', '--max-warnings=0']
      - id: tsc
        name: typescript typecheck (frontend)
        entry: npx
        language: node
        files: \.(ts|tsx)$
        args: ['tsc', '-p', 'tsconfig.json', '--noEmit']
